# This file contains core configuration options for Terra
#
# As you can see, there is not that much to configure here.
# For advanced configuration, use config packs. Config
# packs are loaded from the packs directory. Check the
# wiki for information regarding config pack development.

debug:
  commands: false
  log: false
  profiler: false
  script: false
biome-search-resolution: 4
cache:
  structure: 32
  sampler: 512
  biome-provider: 32
script:
  max-recursion: 1000
ignored-resources:
# A bare managed-directory name ("addons", "packs", "metapacks") skips that whole directory.
# A name fragment skips a single bundled resource and matches it across versions. Anything
# listed here is also deleted from the data folder if an earlier launch already extracted it.
#  - "addons"
#  - "packs"
#  - "metapacks"
# Uncomment to exclude the BubblesOnChunkGen addon (e.g. to measure its worldgen overhead):
#  - "bubbles-chunk-gen"