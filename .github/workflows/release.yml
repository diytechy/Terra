name: Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Fix gradlew permissions
        run: chmod +x ./gradlew

      # Tag is built from the merge commit's short SHA + UTC date, so every
      # merge to main/master produces a unique, sortable release tag without
      # needing a manual semver bump.
      - name: Compute release tag
        id: tag
        run: |
          short_sha=$(git rev-parse --short HEAD)
          date_str=$(date -u +%Y%m%d)
          tag="VIBE-${date_str}-${short_sha}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Release tag: $tag"

      - name: Build all platform jars
        run: ./gradlew build

      - name: List built artifacts
        run: |
          echo "== bukkit =="; ls -la platforms/bukkit/build/libs/ || true
          echo "== cli =="; ls -la platforms/cli/build/libs/ || true
          echo "== allay =="; ls -la platforms/allay/build/libs/ || true
          echo "== merged =="; ls -la platforms/merged/build/libs/ || true

      # Insert VIBE- right after Terra- in each shaded jar's filename so the
      # released assets are visually distinct from upstream PolyhedralDev/Terra
      # builds. The rename does not depend on the -BETA- segment, so when the
      # project switches to a full release (preRelease(false)) the workflow
      # keeps producing Terra-VIBE-<platform>-... jars without changes.
      - name: Rename platform jars with VIBE marker
        run: |
          mkdir -p release-artifacts
          for src in \
            platforms/bukkit/build/libs/Terra-bukkit-*-shaded.jar \
            platforms/cli/build/libs/Terra-cli-*-shaded.jar \
            platforms/allay/build/libs/Terra-allay-*-shaded.jar \
            platforms/merged/build/libs/Terra-merged-*-shaded.jar; do
            [ -e "$src" ] || continue
            base=$(basename "$src")
            renamed=$(echo "$base" | sed 's/^Terra-/Terra-VIBE-/')
            cp "$src" "release-artifacts/$renamed"
            echo "  $base -> $renamed"
          done
          ls -la release-artifacts/

      - name: Create GitHub Release with platform jars
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            release-artifacts/Terra-VIBE-bukkit-*-shaded.jar
            release-artifacts/Terra-VIBE-cli-*-shaded.jar
            release-artifacts/Terra-VIBE-allay-*-shaded.jar
            release-artifacts/Terra-VIBE-merged-*-shaded.jar
